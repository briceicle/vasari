name: Needs and Outputs

on:
  push:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      build-date: ${{ steps.set-version.outputs.build-date }}
    steps:
      - name: Set version output
        id: set-version
        run: |
          VERSION="1.2.3"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build-date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "Prepared: version=$VERSION, build-date=$BUILD_DATE"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Verify output masking
        run: |
          TOKEN="not-a-real-secret-abc123"
          echo "::add-mask::$TOKEN"
          echo "The token value is: $TOKEN"
          echo "If masking works, the line above shows *** instead of the value"

      - name: Write version manifest
        run: |
          printf 'version: "%s"\ndate: "%s"\n' \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build-date }}" \
            > "$GITHUB_WORKSPACE/manifest.yml"

      - name: Extract version with yq
        id: validate-yq
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq '.version' "$GITHUB_WORKSPACE/manifest.yml"

      - name: Show yq result
        run: |
          echo "yq result: ${{ steps.validate-yq.outputs.result }}"

      - name: Use version from prepare
        run: |
          echo "Building version: ${{ needs.prepare.outputs.version }}"
          echo "Build date: ${{ needs.prepare.outputs.build-date }}"
          if [ -z "${{ needs.prepare.outputs.version }}" ]; then
            echo "ERROR: version output is empty"
            exit 1
          fi
          echo "build complete for v${{ needs.prepare.outputs.version }}"

  test:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Use version from prepare
        run: |
          echo "Testing version: ${{ needs.prepare.outputs.version }}"
          if [ -z "${{ needs.prepare.outputs.version }}" ]; then
            echo "ERROR: version output is empty"
            exit 1
          fi
          echo "tests passed for v${{ needs.prepare.outputs.version }}"  
